{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Sermon - Grace Community Church{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center p-5">
                <div class="mb-4">
                    <i class="fas fa-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                </div>
                <h2 class="h4 mb-2">Confirm Delete</h2>
                <p class="text-muted mb-1">Are you sure you want to delete this sermon?</p>
                <p class="fw-medium mb-4">"{{ sermon.title }}"</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'sermons:sermon_detail' sermon.pk %}" class="btn btn-outline-secondary">
                            <i class="fas fa-times me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash me-1"></i> Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
